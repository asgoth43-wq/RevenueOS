services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: revenueos
      POSTGRES_USER: revenueos
      POSTGRES_PASSWORD: revenueos
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revenueos -d revenueos"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      APP_NAME: RevenueOS
      DATABASE_URL: postgresql+psycopg://revenueos:revenueos@db:5432/revenueos
      SECRET_KEY: ${SECRET_KEY:-change-me}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
